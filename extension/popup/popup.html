<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIT BHU Wi-Fi AutoConnect</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <img src="../icons/icon-48.png" class="header-logo" alt="Logo" width="26" height="26">
        <div>
          <h1>IIT BHU AutoConnect</h1>
          <span class="subtitle">Campus Wi-Fi / LAN</span>
        </div>
      </div>
      <div id="status-pill" class="status-pill status-ready">Ready</div>
    </header>

    <!-- Last Connected Indicator Card -->
    <div class="last-connected-card">
      <span class="lc-icon">🕒</span>
      <div class="lc-details">
        <span class="lc-label">Last Auto-Connected</span>
        <span id="last-connected-time" class="lc-time">Never</span>
      </div>
    </div>

    <!-- Main Content -->
    <main class="content">
      <form id="auth-form">
        <div class="form-group">
          <label for="username">Username / Roll No</label>
          <input type="text" id="username" placeholder="e.g. 21074012" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">Wi-Fi Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" id="toggle-password" class="icon-btn" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div class="toggle-group">
          <label class="switch">
            <input type="checkbox" id="auto-login-toggle" checked>
            <span class="slider round"></span>
          </label>
          <span class="toggle-label">Enable Instant Auto-Login</span>
        </div>

        <div class="button-group">
          <button type="submit" id="save-btn" class="btn btn-primary">Save Settings</button>
          <button type="button" id="connect-btn" class="btn btn-secondary">Connect Now</button>
        </div>
      </form>

      <div id="toast" class="toast hidden"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Gateway: <code>192.168.249.1</code></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
